openapi: 3.0.0
info:
  title: Chat Simulation
  version: 1.0.0
servers:
  - url: http://localhost:18096
paths:
  /sim/websocket-async:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Message sent
        '422':
          description: Sending failed
          content:
            text/plain:
              schema:
                type: string
  /sim/ready:
    get:
      responses:
        '200':
          description: Answers 'ready' once the script is loaded
          content:
            text/plain:
              schema:
                type: string
                enum: [not-ready]
  /sim/websocket:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Message sent
        '422':
          description: Sending failed
          content:
            text/plain:
              schema:
                type: string
