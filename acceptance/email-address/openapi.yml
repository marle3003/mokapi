openapi: 3.0.0
info:
  title: Email address
  version: 1.0.0
servers:
  - url: http://localhost:18093
paths:
  /customer:
    get:
      responses:
        '200':
          description: Answers with a generated customerEmailAddress
          content:
            application/json:
              schema:
                type: object
                required: [customerEmailAddress]
                properties:
                  customerEmailAddress:
                    type: string
