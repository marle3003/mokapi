openapi: 3.0.0
info:
  title: Faker context
  version: 1.0.0
servers:
  - url: http://localhost:18100
paths:
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A user with friends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friend'
components:
  schemas:
    Friend:
      type: object
      required: [id, email, firstName, lastName, friends]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        friends:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [id, email, firstName, lastName]
            properties:
              id:
                type: integer
              email:
                type: string
              firstName:
                type: string
              lastName:
                type: string
