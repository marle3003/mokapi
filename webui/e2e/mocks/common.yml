components:
  schemas:
    Info:
      type: object
      properties:
        version:
          type: string
        activeServices:
          type: array
          items:
            type: string
            enum: ["http", "kafka", "mail", "ldap", "mqtt", "websocket"]
        search:
          type: object
          properties:
            enabled:
              type: boolean
    Service:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        contact:
          $ref: '#/components/schemas/Contact'
        type:
          type: string
          enum: ["http", "kafka", "mail", "ldap", "mqtt", "websocket"]
        metrics:
          type: object
        status:
          type: string
    Contact:
      type: object
      properties:
        name:
          type: string
        url:
          type: [ 'string', 'null' ]
        email:
          type: string
    Metrics:
      type: array
      items:
        $ref: '#/components/schemas/Metric'
    Metric:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
    Error:
      type: object
      properties:
        message:
          type: string
    ConfigInfo:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        provider:
          type: string
        time:
          type: string
    Config:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        provider:
          type: string
        time:
          type: string
        refs:
          type: array
          items:
            $ref: '#/components/schemas/ConfigInfo'
        tags:
          type: array
          items:
            type: string