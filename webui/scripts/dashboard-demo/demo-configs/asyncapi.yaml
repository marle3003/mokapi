asyncapi: 3.0.0
info:
  title: Kafka Order Service API
  version: 1.0.0
  description: An API to process customer orders and notify about order status updates using Kafka.

servers:
  development:
    host: localhost:9092
    protocol: kafka
    description: Local development Kafka broker.

channels:
  order_events:
    address: order-topic
    summary: The Kafka topic for order events.
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'
    tags:
      - name: order
  user-events:
    summary: The Kafka topic for user events.
    tags:
      - name: user
  shipment_updates:
    address: shipments.{region}.updates
    title: Shipment Updates per Region
    summary: Regional topics with shipment tracking events.
    description: |
      Each fulfilment region publishes tracking events to its own topic,
      for example `shipments.eu.updates` or `shipments.us.updates`.
      Topics are created on demand as soon as a region starts shipping,
      so a single channel definition covers all regional topics.
    parameters:
      region:
        description: Fulfilment region that handles the shipment.
        enum: [eu, us, apac, latam]
        examples: [eu, us]
    messages:
      ShipmentUpdated:
        $ref: '#/components/messages/ShipmentUpdated'
    bindings:
      kafka:
        partitions: 2
    tags:
      - name: shipping

operations:
  publishNewOrder:
    action: send
    channel:
      $ref: '#/channels/order_events'
    messages:
      - $ref: '#/components/messages/OrderCreated'
    bindings:
      kafka:
        clientId:
          type: string
          description: The producer client ID, must be prefixed with 'producer-'.
          pattern: '^producer-[a-zA-Z0-9-]+$'
  
  receiveOrderStatus:
    action: receive
    channel:
      $ref: '#/channels/order_events'
    messages:
      - $ref: '#/components/messages/OrderStatusUpdated'
    bindings:
      kafka:
        groupId:
          type: string
          description: The consumer group ID, must adhere to internal naming conventions.
          pattern: '^order-status-group-[0-9]{3}$'
  
  publishShipmentUpdate:
    action: send
    channel:
      $ref: '#/channels/shipment_updates'
    summary: A regional fulfilment center reports a shipment status change.
    messages:
      - $ref: '#/channels/shipment_updates/messages/ShipmentUpdated'

  receiveShipmentUpdates:
    action: receive
    channel:
      $ref: '#/channels/shipment_updates'
    summary: The order service tracks shipments across all regions.
    messages:
      - $ref: '#/channels/shipment_updates/messages/ShipmentUpdated'
    bindings:
      kafka:
        groupId:
          type: string
          pattern: '^shipment-tracking-[a-z]+$'

components:
  messages:
    OrderCreated:
      name: OrderCreatedEvent
      title: Order Created Event
      summary: Notification that a new order has been created.
      payload:
        $ref: '#/components/schemas/OrderPayload'
      examples:
        - name: new-order-example
          payload:
            orderId: "7e2b4d0f-1aa1-49e3-9f11-54c266d480c3"
            productId: "PROD-ABC"
            quantity: 2
            customerEmail: "customer@example.com"
            status: "CREATED"

    OrderStatusUpdated:
      name: OrderStatusUpdatedEvent
      title: Order Status Updated Event
      summary: Notification about an update in the order status.
      payload:
        $ref: '#/components/schemas/OrderPayload'
      examples:
        - name: status-update-example
          payload:
            orderId: "7e2b4d0f-1aa1-49e3-9f11-54c266d480c3"
            productId: "PROD-ABC"
            quantity: 2
            customerEmail: "customer@example.com"
            status: "SHIPPED"

    ShipmentUpdated:
      name: ShipmentUpdatedEvent
      title: Shipment Updated Event
      summary: A shipment moved to a new tracking status.
      payload:
        $ref: '#/components/schemas/ShipmentPayload'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: The order ID, so all events of an order stay in order on one partition.
          bindingVersion: 0.4.0
      examples:
        - name: shipment-in-transit
          summary: Parcel left the EU hub.
          payload:
            shipmentId: "8f14e45f-ceea-467f-a8f2-3c6e5b1d2a90"
            orderId: "c9bf9e57-1685-4c89-bafb-ff5af830be8a"
            region: eu
            carrier: DHL
            status: IN_TRANSIT
            location: "Frankfurt Hub"
            timestamp: "2026-10-20T09:15:00Z"
            estimatedDelivery: "2026-10-22"
        - name: shipment-delivered
          summary: Parcel delivered in the US.
          payload:
            shipmentId: "1b4e28ba-2fa1-41d2-883f-0016d3cca427"
            orderId: "a3bb189e-8bf9-4888-9912-ace4e6543002"
            region: us
            carrier: UPS
            status: DELIVERED
            location: "Austin, TX"
            timestamp: "2026-10-20T16:42:00Z"
  
  schemas:
    OrderPayload:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          description: Unique ID of the order.
        productId:
          type: string
          description: ID of the product ordered.
        productName:
          type: string
        quantity:
          type: integer
          description: Number of items ordered.
        customerEmail:
          type: string
          format: email
          description: Email address of the customer.
        status:
          type: string
          enum: [CREATED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
          description: The current status of the order.
      required:
        - orderId
        - productId
        - quantity
        - customerEmail
        - status

    ShipmentPayload:
      type: object
      properties:
        shipmentId:
          type: string
          format: uuid
          description: Unique ID of the shipment.
        orderId:
          type: string
          format: uuid
          description: The order this shipment belongs to.
        region:
          type: string
          enum: [eu, us, apac, latam]
          description: Fulfilment region; matches the topic parameter.
        carrier:
          type: string
          enum: [DHL, UPS, FedEx, DPD, Post]
        status:
          type: string
          enum: [LABEL_CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION]
          description: Current tracking status.
        location:
          type: string
          description: Last known location of the parcel.
        timestamp:
          type: string
          format: date-time
          description: When the status change happened.
        estimatedDelivery:
          type: string
          format: date
      required: [shipmentId, orderId, region, carrier, status, timestamp]