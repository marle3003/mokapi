asyncapi: 3.0.0
info:
  title: WebSocket Chat API
  version: 1.0.0
  description: A real-time Chat API based on WebSockets for bidirectional communication within chat rooms.

servers:
  production:
    host: localhost:8000
    protocol: ws
    description: The primary WebSocket server for all live chat connections.

channels:
  chat:
    address: /chats/{roomId}
    description: The communication channel for a specific chat room.
    parameters:
      roomId:
        description: The unique identifier of the chat room the user wants to join.
        schema:
          type: string
    messages:
      incoming:
        $ref: '#/components/messages/ChatMessage'
      outgoing:
        $ref: '#/components/messages/ServerMessage'

operations:
  onChatMessage:
    action: receive
    description: Operation to receive messages sent by clients into the chat room.
    channel:
      $ref: '#/channels/chat'
    messages:
      - $ref: '#/channels/chat/messages/incoming'

  sendChatMessage:
    action: send
    description: Operation to send system messages or replies from the server to the clients in the chat room.
    channel:
      $ref: '#/channels/chat'
    messages:
      - $ref: '#/channels/chat/messages/outgoing'

components:
  messages:
    ChatMessage:
      description: A text message sent by the client.
      payload:
        type: object
        properties:
          text:
            type: string
            description: The actual text content of the chat message.
          username:
            type: string
    ServerMessage:
      description: A response or status update generated by the server.
      payload:
        type: object
        properties:
          text:
            type: string
            description: The actual text content of the chat message.
          from:
            type: string
          timestamp:
            type: string
            format: date-time
