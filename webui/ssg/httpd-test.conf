# Apache for `npm run test-htaccess` (ssg/test-htaccess.js): the httpd:2.4 image with the built
# website mounted as document root, so public/website/.htaccess runs as on the web host.
#
# Plain HTTP only. The https rule of .htaccess looks at %{SERVER_PORT}, so there are two virtual hosts:
# port 443 stands in for https (all rules except the https redirect), port 80 for http.
ServerRoot "/usr/local/apache2"
Listen 80
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
# the web host has it: .htaccess switches it off with Options -MultiViews
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule rewrite_module modules/mod_rewrite.so

User daemon
Group daemon
ServerName mokapi.io
# redirects and %{SERVER_PORT} follow the ServerName of the virtual host, not the port of the test
UseCanonicalName On
ErrorLog /proc/self/fd/2
LogLevel warn
TypesConfig conf/mime.types

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:80>
    ServerName mokapi.io:80
</VirtualHost>

<VirtualHost *:443>
    ServerName mokapi.io:443
</VirtualHost>
