name: "Publish docker image"
description: "Publish docker image to docker repository"
inputs:
  image-name:
    required: true
    description: "The mokapi image name"
  artifact-name:
    required: true
    description: "The artifact name to download image"
  docker-username:
    required: true
    description: docker username
  docker-password:
    required: true
    description: docker password
runs:
  using: "composite"
  steps:
    - name: Download image
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp
    - name: Load image
      run: docker load --input /tmp/mokapi.tar
      shell: bash
    - name: Login to Docker
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}
    - name: Push image mokapi/mokapi:v-alpha to Docker
      run: docker push ${{ inputs.image-name }}
      shell: bash
    - name: Push image mokapi/mokapi:alpha to Docker
      run: docker push mokapi/mokapi:alpha
      shell: bash