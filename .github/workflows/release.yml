name: Release
on:
  release:
    types: [published]
  # push: tags: ['v*']
  # Used by: release-npm only
  # npm provenance requires a Sigstore certificate with a valid
  # SourceRepositoryRef extension. Fulcio (the Sigstore CA) populates
  # this field from the OIDC token's ref claim. For release events,
  # GitHub sets headBranch/ref to the default branch (main), not the tag,
  # so Fulcio cannot populate SourceRepositoryRef correctly and npm
  # rejects the provenance bundle. Tag push events set ref to
  # refs/tags/vX.Y.Z, which Fulcio includes correctly in the certificate.
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  build-dashboard:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.4
      - uses: ./.github/actions/build-release-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
        working-directory: ./webui
      - name: Install taskfile
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
      - name: Build
        run: task build-vue-app
      - name: Upload UI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard
          path: webui/dist

  release-unix:
    if: github.event_name == 'release'
    needs: build-dashboard
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Download dashboard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard
          path: webui/dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Docker Login
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
        with:
          username: marle3003
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.4
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  release-windows:
    if: github.event_name == 'release'
    needs: build-dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Download dashboard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard
          path: webui/dist
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.4
      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
      - name: Generate Windows metadata (.syso)
        working-directory: ./cmd/mokapi
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $versionParts = ($tag -replace '^v', '').Split('.')
          '{}' | Out-File versioninfo.json -NoNewline ascii
          goversioninfo -64 `
            -platform-specific='true' `
            -charset="1200" `
            -company="Mokapi OpenSource" `
            -copyright="© Marcel Lehmann. Licensed under MIT." `
            -description="Your API Mocking Tool for Agile Development, using Go and JavaScript" `
            -icon="../../icon.ico" `
            -internal-name="mokapi" `
            -original-name="mokapi.exe" `
            -product-name="mokapi" `
            -translation="0x0409" `
            -ver-major="$($versionParts[0])" `
            -ver-minor="$($versionParts[1])" `
            -ver-patch="$($versionParts[2])" `
            -product-version="$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release -f .goreleaser.windows.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  release-npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: 1.26.4
      - uses: ./.github/actions/build-release-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm install
        working-directory: ./webui
      - name: Install taskfile
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
      - name: Publish
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          task publish-all VERSION="$VERSION"
        env:
          CGO_ENABLED: 0